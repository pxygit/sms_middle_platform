name: ${COMPOSE_PROJECT_NAME:-sunnysms}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sunnysms}
      POSTGRES_USER: ${POSTGRES_USER:-sunnysms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
      PGTZ: ${APP_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sunnysms

  api:
    user: "${PUID:-1000}:${PGID:-1000}"
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.25.0}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_DSN: host=postgres user=${POSTGRES_USER:-sunnysms} password=${POSTGRES_PASSWORD:-change-me-postgres-password} dbname=${POSTGRES_DB:-sunnysms} port=5432 sslmode=disable TimeZone=${APP_TIMEZONE:-Asia/Shanghai}
      CARD_EXPORT_DIR: /app/storage/card_exports
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./data/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sunnysms

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-24-alpine}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${SUNNYSMS_HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sunnysms

networks:
  sunnysms:
    driver: bridge